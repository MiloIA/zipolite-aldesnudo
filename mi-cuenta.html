<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta — Zipolite al Desnudo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ocean: #0097A7;
      --teal:  #1a9fa0;
      --teal2: #157f80;
      --sand:  #FFFBF2;
      --dark:  #0B2E3E;
      --red:   #E8312A;
      --border: #e2ddd6;
      --text:  #374151;
      --muted: #6b7280;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f0f4f7;
      min-height: 100vh;
      color: var(--text);
    }

    .rainbow-bar {
      height: 5px;
      background: linear-gradient(90deg,#E8312A 0%,#F5831F 20%,#FFCA28 40%,#4CAF50 60%,#00BCD4 80%,#9C27B0 100%);
    }

    /* ── TOP BAR ── */
    .top-bar {
      background: var(--dark);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tb-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .tb-logo img { height: 34px; width: auto; }
    .tb-logo span {
      color: #fff;
      font-family: 'Fraunces', serif;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .tb-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tb-nombre {
      color: rgba(255,255,255,0.85);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-logout {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.22); }

    /* ── LOADING ── */
    .view-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── LOGIN ── */
    .view-login {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-box {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .login-brand p { font-size: 0.82rem; color: var(--muted); }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--dark);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .oauth-btn:hover { background: #f5f5f5; border-color: #bbb; }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e2e2;
    }
    .fg { margin-bottom: 14px; }
    .fg label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .fg input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .fg input:focus { border-color: var(--teal); }
    .btn-primary-full {
      display: block;
      width: 100%;
      padding: 13px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 99px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary-full:hover { background: var(--teal2); }
    .btn-text {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      display: block;
      margin: 10px auto 0;
    }
    .btn-text-teal {
      background: none;
      border: none;
      color: var(--teal);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      display: block;
      margin-top: 4px;
    }
    .login-msg {
      font-size: 0.82rem;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
      font-weight: 600;
    }
    .login-msg.ok  { color: #15803d; }
    .login-msg.err { color: var(--red); }

    /* ── DASHBOARD ── */
    .cuenta-dashboard {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .cuenta-welcome { margin-bottom: 20px; }
    .cuenta-welcome h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .cuenta-welcome p { font-size: 0.88rem; color: var(--muted); }
    .loading-text {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 32px 0;
    }

    /* ── RESERVATION CARDS (from spec) ── */
    .reserva-card-cliente {
      background: white;
      border-radius: 16px;
      border: 1px solid #e2ddd6;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(11,46,62,0.06);
    }
    .rc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .rc-paquete {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #1a9fa0;
      display: block;
    }
    .rc-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: #0B2E3E;
      margin: 4px 0;
    }
    .rc-fechas { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .rc-estado {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .rc-estado.pendiente  { background: #fff3cd; color: #856404; }
    .rc-estado.parcial    { background: #fff3cd; color: #856404; }
    .rc-estado.confirmada { background: #d1e7dd; color: #0a3622; }
    .rc-estado.cancelada  { background: #f8d7da; color: #842029; }
    .rc-progress {
      height: 6px;
      background: #e2ddd6;
      border-radius: 99px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .rc-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1a9fa0, #4CAF50);
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .rc-amounts {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .rc-amounts div { display: flex; flex-direction: column; }
    .rc-amounts span { color: #888; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .rc-amounts strong { font-size: 1rem; }
    .green  { color: #1a9fa0; }
    .orange { color: #e07b00; }
    .rc-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #1a9fa0;
      color: white;
      text-align: center;
      border-radius: 99px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .rc-btn:hover { background: var(--teal2); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(11,46,62,0.06);
    }
    .empty-state p { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .btn-paquetes {
      display: inline-block;
      padding: 11px 24px;
      background: var(--teal);
      color: white;
      border-radius: 99px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.88rem;
      transition: background 0.2s;
    }
    .btn-paquetes:hover { background: var(--teal2); }
  </style>
</head>
<body>

<div class="rainbow-bar"></div>

<header class="top-bar">
  <a href="/" class="tb-logo">
    <img src="/logo.png" alt="Zipolite al Desnudo">
    <span>Zipolite al Desnudo</span>
  </a>
  <div class="tb-user" id="tb-user" style="display:none;">
    <span class="tb-nombre" id="tb-nombre"></span>
    <button class="btn-logout" onclick="doSignOut()">Cerrar sesión</button>
  </div>
</header>

<!-- LOADING -->
<div class="view-loading" id="view-loading">
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div class="view-login" id="view-login" style="display:none;">
  <div class="login-box">
    <div class="login-brand">
      <h2>🌈 Mi Cuenta</h2>
      <p>Inicia sesión para ver tus reservas</p>
    </div>

    <!-- Step 1: email -->
    <div id="lp-step-1">
      <button class="oauth-btn" onclick="signInGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuar con Google
      </button>
      <div class="divider"><span>o con tu email</span></div>
      <div class="fg">
        <label>Email</label>
        <input type="email" id="lp-email" placeholder="tu@email.com" onkeydown="if(event.key==='Enter')checkEmail()">
      </div>
      <button class="btn-primary-full" onclick="checkEmail()">Continuar →</button>
    </div>

    <!-- Step 2a: existing user -->
    <div id="lp-step-login" style="display:none;">
      <p style="font-size:0.82rem;color:#5a7a86;margin-bottom:14px;text-align:center;">✉️ <strong id="lp-email-show-login"></strong></p>
      <div class="fg">
        <label>Contraseña</label>
        <input type="password" id="lp-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-text-teal" onclick="resetPass()">¿Olvidaste tu contraseña?</button>
      <button class="btn-primary-full" onclick="doLogin()">Iniciar sesión</button>
      <button class="btn-text" onclick="backToStep1()">← Cambiar email</button>
    </div>

    <!-- Step 2b: new user -->
    <div id="lp-step-signup" style="display:none;">
      <p style="font-size:0.82rem;color:#5a7a86;margin-bottom:14px;text-align:center;">✉️ <strong id="lp-email-show-signup"></strong></p>
      <div class="fg">
        <label>Nombre completo</label>
        <input type="text" id="lp-name" placeholder="Tu nombre">
      </div>
      <div class="fg">
        <label>Contraseña</label>
        <input type="password" id="lp-signup-pass" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')doSignup()">
      </div>
      <button class="btn-primary-full" onclick="doSignup()">Crear cuenta</button>
      <button class="btn-text" onclick="backToStep1()">← Cambiar email</button>
    </div>

    <div class="login-msg" id="lp-msg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="view-dashboard" style="display:none;">
  <div class="cuenta-dashboard">
    <div class="cuenta-welcome">
      <h1>Mis reservas</h1>
      <p id="welcome-text">Bienvenido. Aquí puedes ver y gestionar tus viajes.</p>
    </div>
    <div id="mis-reservas">
      <div class="loading-text">Cargando tus reservas...</div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://rimpazjnhxnrkvziqmbj.supabase.co';
const SB_KEY = 'sb_publishable_NEoxD-p2ZK-VzzFpYlVlUw_nxbMWARz';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let currentUser = null;

const VIEWS = { loading: 'flex', login: 'flex', dashboard: 'block' };
function show(v) {
  document.getElementById('view-loading').style.display   = v === 'loading'   ? 'flex'  : 'none';
  document.getElementById('view-login').style.display     = v === 'login'     ? 'flex'  : 'none';
  document.getElementById('view-dashboard').style.display = v === 'dashboard' ? 'block' : 'none';
}

function showDashboard(user) {
  const name = user.user_metadata?.full_name || user.email.split('@')[0];
  document.getElementById('tb-user').style.display = 'flex';
  document.getElementById('tb-nombre').textContent = 'Hola, ' + name;
  document.getElementById('welcome-text').textContent =
    `Bienvenido, ${name}. Aquí puedes ver y gestionar tus viajes.`;
  show('dashboard');
  loadReservas(user.email);
}

// ── Auth state ──
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && !currentUser) {
    currentUser = session.user;
    showDashboard(session.user);
  } else if (event === 'SIGNED_OUT') {
    currentUser = null;
    document.getElementById('tb-user').style.display = 'none';
    show('login');
  }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    showDashboard(session.user);
  } else {
    show('login');
  }
})();

// ── Login functions ──
async function signInGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/mi-cuenta' }
  });
  if (error) showMsg('Error: ' + error.message, true);
}

async function checkEmail() {
  const email = document.getElementById('lp-email').value.trim();
  if (!email) { showMsg('Escribe tu email', true); return; }
  showMsg('Verificando...', false);
  const { error } = await sb.auth.signInWithPassword({ email, password: '' });
  if (error?.message === 'Invalid login credentials') {
    document.getElementById('lp-step-1').style.display = 'none';
    document.getElementById('lp-step-login').style.display = 'block';
    document.getElementById('lp-email-show-login').textContent = email;
    document.getElementById('lp-pass').value = '';
    clearMsg();
    document.getElementById('lp-pass').focus();
  } else {
    document.getElementById('lp-step-1').style.display = 'none';
    document.getElementById('lp-step-signup').style.display = 'block';
    document.getElementById('lp-email-show-signup').textContent = email;
    document.getElementById('lp-name').value = '';
    document.getElementById('lp-signup-pass').value = '';
    clearMsg();
    document.getElementById('lp-name').focus();
  }
}

async function doLogin() {
  const email = document.getElementById('lp-email').value.trim();
  const pass  = document.getElementById('lp-pass').value;
  if (!pass) { showMsg('Escribe tu contraseña', true); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) showMsg('Error: ' + error.message, true);
  else showMsg('✅ ¡Bienvenido!', false);
}

async function doSignup() {
  const email = document.getElementById('lp-email').value.trim();
  const name  = document.getElementById('lp-name').value.trim();
  const pass  = document.getElementById('lp-signup-pass').value;
  if (!name || !pass) { showMsg('Completa todos los campos', true); return; }
  const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
  if (error) showMsg('Error: ' + error.message, true);
  else showMsg('✅ ¡Cuenta creada! Revisa tu email para confirmar.', false);
}

function resetPass() {
  const email = document.getElementById('lp-email').value.trim();
  if (!email) { showMsg('Escribe tu email primero', true); return; }
  sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/mi-cuenta' })
    .then(() => showMsg('✅ Revisa tu email para restablecer tu contraseña', false));
}

function backToStep1() {
  document.getElementById('lp-step-login').style.display  = 'none';
  document.getElementById('lp-step-signup').style.display = 'none';
  document.getElementById('lp-step-1').style.display      = 'block';
  clearMsg();
}

function showMsg(text, isError) {
  const el = document.getElementById('lp-msg');
  el.textContent = text;
  el.className = 'login-msg ' + (isError ? 'err' : 'ok');
  if (!isError) setTimeout(() => { el.textContent = ''; el.className = 'login-msg'; }, 3500);
}

function clearMsg() {
  const el = document.getElementById('lp-msg');
  el.textContent = '';
  el.className = 'login-msg';
}

async function doSignOut() {
  await sb.auth.signOut();
}

// ── Reservations ──
const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-MX');

async function loadReservas(email) {
  const container = document.getElementById('mis-reservas');
  try {
    const res = await fetch(`/api/pagos?email=${encodeURIComponent(email)}&cliente=1`);
    if (!res.ok) throw new Error('error');
    const { data } = await res.json();

    if (!data || !data.length) {
      container.innerHTML = `
        <div class="empty-state">
          <p>Aún no tienes reservas. ¡Explora nuestros paquetes!</p>
          <a href="/#paquetes" class="btn-paquetes">Ver paquetes →</a>
        </div>`;
      return;
    }

    const estadoLabels = {
      confirmada: '✅ Confirmada',
      parcial:    '⏳ Parcial',
      pendiente:  '🕐 Pendiente',
      cancelada:  '❌ Cancelada',
    };

    container.innerHTML = data.map(r => {
      const pagado    = Number(r.total_pagado) || 0;
      const total     = Number(r.total) || 0;
      const pendiente = Math.max(0, total - pagado);
      const pct       = total > 0 ? Math.min(100, Math.round(pagado / total * 100)) : 0;
      const estado    = r.estado || 'pendiente';
      const titulo    = r.variante_nombre || r.paquete_nombre || '—';
      const fechas    = r.fecha_inicio && r.fecha_fin
        ? `${r.fecha_inicio} — ${r.fecha_fin}`
        : (r.fecha_inicio || '');

      return `
        <div class="reserva-card-cliente">
          <div class="rc-header">
            <div>
              <span class="rc-paquete">${r.paquete_nombre || ''}</span>
              <h3 class="rc-titulo">${titulo}</h3>
              ${fechas ? `<p class="rc-fechas">${fechas}</p>` : ''}
            </div>
            <span class="rc-estado ${estado}">${estadoLabels[estado] || estado}</span>
          </div>

          <div class="rc-progress">
            <div class="rc-progress-fill" style="width:${pct}%"></div>
          </div>

          <div class="rc-amounts">
            <div><span>Pagado</span><strong class="green">${fmt(pagado)}</strong></div>
            <div><span>Pendiente</span><strong class="orange">${fmt(pendiente)}</strong></div>
            <div><span>Total</span><strong>${fmt(total)}</strong></div>
          </div>

          <a href="/mi-reserva?id=${r.id}" class="rc-btn">Ver detalle y pagar →</a>
        </div>`;
    }).join('');
  } catch (_) {
    container.innerHTML = `
      <div class="empty-state">
        <p>No se pudieron cargar tus reservas. Intenta de nuevo.</p>
        <a href="/#paquetes" class="btn-paquetes">Ver paquetes →</a>
      </div>`;
  }
}
</script>
</body>
</html>
